<!-- Self-Contained Mobile Interaction & Smooth Scrolling Script -->
<script>
    $(document).ready(function() {
        // Toggle Mobile Hamburger Menu open/closed
        $('#navToggle').click(function(e) {
            e.stopPropagation();
            $('#navMenu').toggleClass('active');
        });

        // Close menu if user clicks anywhere else on the screen
        $(document).click(function() {
            $('#navMenu').removeClass('active');
        });

        // Smart responsive smooth scroll to any column section
        window.scrollToSection = function(selector) {
            var target = $(selector);
            if (target.length) {
                $('html, body').animate({
                    scrollTop: target.offset().top - $('.navbar').outerHeight() - 15
                }, 600);
                
                // Close menu on mobile after selection
                $('#navMenu').removeClass('active');
            }
        };
    });
</script>
